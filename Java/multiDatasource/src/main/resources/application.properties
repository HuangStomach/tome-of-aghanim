
# Datasource A (MySQL)
spring.datasource.a.jdbc-url=jdbc:mysql://localhost:3306/db_a?useSSL=false&serverTimezone=UTC
spring.datasource.a.username=root
spring.datasource.a.password=password
spring.datasource.a.driver-class-name=com.mysql.cj.jdbc.Driver

# Datasource B (GaussDB uses PostgreSQL driver)
spring.datasource.b.jdbc-url=jdbc:postgresql://localhost:5432/db_b
spring.datasource.b.username=postgres
spring.datasource.b.password=password
spring.datasource.b.driver-class-name=org.postgresql.Driver

# Datasource C (MySQL - read only)
spring.datasource.c.jdbc-url=jdbc:mysql://localhost:3306/db_c?useSSL=false&serverTimezone=UTC
spring.datasource.c.username=root
spring.datasource.c.password=password
spring.datasource.c.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA properties for datasource A
spring.jpa.a.hibernate.ddl-auto=update
spring.jpa.a.show-sql=true
# spring.jpa.a.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JPA properties for datasource B
spring.jpa.b.hibernate.ddl-auto=update
spring.jpa.b.show-sql=true
spring.jpa.b.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA properties for datasource C (read only)
spring.jpa.c.hibernate.ddl-auto=none
spring.jpa.c.show-sql=true
# spring.jpa.c.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
