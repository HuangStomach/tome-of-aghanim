spring:
  datasource:
    a:
      jdbc-url: jdbc:mysql://localhost:3306/db_a?useSSL=false&serverTimezone=UTC
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
    b:
      jdbc-url: jdbc:postgresql://localhost:5432/db_b
      username: postgres
      password: password
      driver-class-name: org.postgresql.Driver
    c:
      jdbc-url: jdbc:mysql://localhost:3306/db_c?useSSL=false&serverTimezone=UTC
      username: root
      password: password
      driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    a:
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL8Dialect
          hbm2ddl:
          	auto: update
    b:
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          hbm2ddl:
          	auto: update
    c:
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL8Dialect
          hbm2ddl:
          	auto: none
